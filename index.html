<style>
:root{
  --paper:#F5F4F0; --surface:#FFFFFF;
  --rule:#E2E0D9; --rule-strong:#C6C4BA;
  --ink:#191B20; --ink-2:#565A63; --ink-3:#8B8E96;
  --accent:#2F449B; --accent-soft:#E6E9F6;
  --warn:#8E5416; --warn-soft:#F4EADC;
  --good:#3D7053;
  --shadow:0 1px 2px rgba(25,27,32,.05), 0 8px 24px -12px rgba(25,27,32,.12);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121418; --surface:#191C22;
    --rule:#272B33; --rule-strong:#3B404A;
    --ink:#E9E8E4; --ink-2:#A2A6AF; --ink-3:#70747D;
    --accent:#9AA9F0; --accent-soft:#222842;
    --warn:#D9A05B; --warn-soft:#2E2519;
    --good:#7FB08D;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#121418; --surface:#191C22;
  --rule:#272B33; --rule-strong:#3B404A;
  --ink:#E9E8E4; --ink-2:#A2A6AF; --ink-3:#70747D;
  --accent:#9AA9F0; --accent-soft:#222842;
  --warn:#D9A05B; --warn-soft:#2E2519;
  --good:#7FB08D;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

.wrap{
  max-width:680px;margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) 20px calc(72px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;min-height:100%;
}
.top{display:flex;align-items:baseline;gap:14px;padding-top:8px}
.mark{font-family:var(--serif);font-size:19px;letter-spacing:-.01em;color:var(--ink);flex:none}
.mark em{font-style:italic;color:var(--accent)}
.nav{margin-left:auto;display:flex;gap:2px;align-items:center}
.nav button{font-size:12px;letter-spacing:.03em;color:var(--ink-3);padding:6px 10px;border-radius:999px;transition:color .15s,background .15s}
.nav button:hover{color:var(--ink-2)}
.nav button[aria-current="true"]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.nav .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px}
.nav button[aria-current="true"] .n{color:var(--accent)}
.gear{font-size:13px;color:var(--ink-3);padding:6px 8px;border-radius:999px}
.gear:hover{color:var(--ink-2)}

.status{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);padding-top:8px;height:15px;text-align:right;
}
.status[data-s="saved"],.status[data-s="synced"]{color:var(--good)}
.status[data-s="offline"],.status[data-s="pending"]{color:var(--warn)}
main{flex:1;display:flex;flex-direction:column}

/* dump */
.dump{padding-top:5vh;display:flex;flex-direction:column;flex:1}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.line{border-bottom:1px solid var(--rule-strong);transition:border-color .2s}
.line:focus-within{border-color:var(--accent)}
#field{
  width:100%;display:block;resize:none;overflow:hidden;background:none;border:none;
  padding:6px 0 12px;font-family:var(--serif);font-size:clamp(23px,4.6vw,30px);
  line-height:1.35;color:var(--ink);
}
#field:focus{outline:none}

<body>
<div id="root"></div>
<div class="flash" id="flash" role="status" aria-live="polite"></div>
<script>
/* Loose Threads — offline-first capture.
   Local storage is the source of truth; the server (optional) is a mirror. */
(function () {
  "use strict";

  /* ─────────────────────────────────────────────────────────────
     FILL THESE IN ONCE and every device connects by itself —
     a new phone, tablet or browser then only needs to sign in.

     Safe to commit: the anon/publishable key is meant to be public.
     It grants nothing on its own; row-level security is what keeps
     your threads yours, and signups being closed keeps the project
     to you alone.
     ───────────────────────────────────────────────────────────── */
  var DEFAULT_CFG = {
    url: "https://rupezoschqzjanejelum.supabase.co",   // e.g. "https://abcdefghijkl.supabase.co"
    key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1cGV6b3NjaHF6amFuZWplbHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MjczNDgsImV4cCI6MjEwMzQwMzM0OH0.X1-XcMQzHvrP78UFe9qr9guGfwGxTaO9vT6ZSSnv7V4"    // e.g. "eyJhbGciOi…"  (or "sb_publishable_…")
  };

  var BUCKETS = [
    { k: "do", label: "Do" },
    { k: "buy", label: "Buy" },
    { k: "idea", label: "Idea" },
    { k: "ask", label: "Ask" }
  ];
  var STALE_DAYS = 7;
  var DB = "loose-threads";

  var items = [];          // in-memory mirror of the items store
  var cfg = null;          // {url, key} — Supabase project, optional
  var session = null;      // {access_token, refresh_token, expires_at, email}
  var view = "dump";
  var filter = "all";
  var statusText = "";
  var syncTimer = null;
  var syncing = false;
  var lastSync = null;     // ISO time of the last successful sync
  var deferredInstall = null;

  /* ---------------- IndexedDB ---------------- */
  var dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () {
        var d = r.result;
        if (!d.objectStoreNames.contains("items")) d.createObjectStore("items", { keyPath: "id" });
        if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    return dbp;
  }
  function tx(store, mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(store, mode);
        var s = t.objectStore(store);
        var out = fn(s);
        t.oncomplete = function () {
          // A missing key gives an IDBRequest whose result is undefined — unwrap it
          // properly rather than handing back the request object itself.
          res(typeof IDBRequest !== "undefined" && out instanceof IDBRequest ? out.result : out);
        };
        t.onerror = function () { rej(t.error); };
        t.onabort = function () { rej(t.error); };
      });
    });
  }
  function allItems() { return tx("items", "readonly", function (s) { return s.getAll(); }); }
  function putItem(i) { return tx("items", "readwrite", function (s) { return s.put(i); }); }
  function putItems(list) {
    return tx("items", "readwrite", function (s) { list.forEach(function (i) { s.put(i); }); });
  }
  function metaGet(k) { return tx("meta", "readonly", function (s) { return s.get(k); }); }
  function metaSet(k, v) { return tx("meta", "readwrite", function (s) { return s.put(v, k); }); }

  /* ---------------- helpers ---------------- */
  function uid() { return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8); }
  function nowIso() { return new Date().toISOString(); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ago(iso) {
    var ms = Date.now() - new Date(iso).getTime();
    if (isNaN(ms)) return "";
    var m = Math.floor(ms / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + "m";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "h";
    var d = Math.floor(h / 24);
    if (d === 1) return "yesterday";
    if (d < 14) return d + "d";
    var w = Math.floor(d / 7);
    if (w < 9) return w + "w";
    return Math.floor(d / 30) + "mo";
  }
  function isStale(i) {
    return i.status === "open" && (Date.now() - new Date(i.updated).getTime()) / 86400000 >= STALE_DAYS;
  }
  function sorted() {
    return items.slice().sort(function (a, b) { return (b.created || "").localeCompare(a.created || ""); });
  }
  function openItems() { return sorted().filter(function (i) { return i.status === "open"; }); }
  function baked() { return !!(DEFAULT_CFG.url && DEFAULT_CFG.key); }
  function pendingCount() { return items.filter(function (i) { return i.dirty; }).length; }

  /* ---------------- mutations ---------------- */
  function capture(text) {
    text = (text || "").trim();
    if (!text) return null;
    var it = {
      id: uid(), body: text, created: nowIso(), updated: nowIso(),
      status: "open", bucket: null, dirty: 1
    };
    items.push(it);
    putItem(it).then(afterWrite, afterWrite);
    return it;
  }
  function patch(id, fields) {
    var it = items.filter(function (i) { return i.id === id; })[0];
    if (!it) return;
    Object.keys(fields).forEach(function (k) { it[k] = fields[k]; });
    it.updated = nowIso();
    it.dirty = 1;
    putItem(it).then(afterWrite, afterWrite);
  }
  function afterWrite() {
    setStatus(cfg ? "pending" : "saved");
    scheduleSync();
  }

  /* ---------------- sync (optional) ---------------- */
  function scheduleSync() {
    if (!cfg || !session) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(sync, 900);
  }

  function api(path, opts) {
    opts = opts || {};
    var h = opts.headers || {};
    h["apikey"] = cfg.key;
    h["Content-Type"] = "application/json";
    if (session && session.access_token) h["Authorization"] = "Bearer " + session.access_token;
    opts.headers = h;
    return fetch(cfg.url.replace(/\/+$/, "") + path, opts).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) {
          var e = new Error(t || ("HTTP " + r.status));
          e.status = r.status;
          throw e;
        });
      }
      return r.status === 204 ? null : r.json().catch(function () { return null; });
    });
  }

  function ensureToken() {
    if (!session) return Promise.reject(new Error("no session"));
    if (session.expires_at && session.expires_at - Date.now() > 60000) return Promise.resolve();
    return api("/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(function (j) {
      if (!j || !j.access_token) throw new Error("refresh failed");
      session = {
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        expires_at: Date.now() + (j.expires_in || 3600) * 1000,
        email: (j.user && j.user.email) || (session && session.email)
      };
      return metaSet("session", session);
    });
  }

  function sync() {
    if (syncing || !cfg || !session) return Promise.resolve();
    if (navigator.onLine === false) { setStatus("offline"); return Promise.resolve(); }
    syncing = true;
    setStatus("syncing");

    return ensureToken().then(function () {
      var dirty = items.filter(function (i) { return i.dirty; });
      if (!dirty.length) return null;
      var rows = dirty.map(function (i) {
        return {
          id: i.id, body: i.body, created: i.created,
          updated: i.updated, status: i.status, bucket: i.bucket
        };
      });
      return api("/rest/v1/threads", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify(rows)
      }).then(function () {
        dirty.forEach(function (i) { i.dirty = 0; });
        return putItems(dirty);
      });
    }).then(function () {
      // Pull the whole table, not the rows changed since last time. Incremental
      // pulls need a clock everyone agrees on: a thought captured offline at 10:00
      // and pushed at 11:05 carries a 10:00 stamp, so a device that had already
      // pulled up to 11:00 would skip it forever. The pile is small — read it all.
      return api("/rest/v1/threads?select=*&order=updated.asc");
    }).then(function (rows) {
      if (!rows || !rows.length) return null;
      var byId = {};
      items.forEach(function (i) { byId[i.id] = i; });
      var changed = [];
      rows.forEach(function (r) {
        var local = byId[r.id];
        if (local && local.updated >= r.updated) return; // ours is the same or newer
        var merged = {
          id: r.id, body: r.body, created: r.created, updated: r.updated,
          status: r.status, bucket: r.bucket, dirty: 0
        };
        if (local) { Object.keys(merged).forEach(function (k) { local[k] = merged[k]; }); changed.push(local); }
        else { items.push(merged); changed.push(merged); }
      });
      return changed.length ? putItems(changed) : null;
    }).then(function () {
      syncing = false;
      lastSync = nowIso();
      metaSet("lastSync", lastSync);
      setStatus(pendingCount() ? "pending" : "synced");
      render();
    }).catch(function (err) {
      syncing = false;
      if (String(err && err.message).indexOf("refresh failed") > -1 || (err && err.status === 401)) {
        session = null;
        metaSet("session", null);
        setStatus("signin");
      } else if (navigator.onLine === false) {
        setStatus("offline");
      } else {
        setStatus("pending");
        clearTimeout(syncTimer);
        syncTimer = setTimeout(sync, 15000);
      }
      render();
    });
  }

  function signIn(email) {
    var redirect = location.origin + location.pathname;
    return api("/auth/v1/otp?redirect_to=" + encodeURIComponent(redirect), {
      method: "POST",
      body: JSON.stringify({ email: email, create_user: true })
    });
  }

  function captureAuthRedirect() {
    var h = location.hash || "";
    if (h.indexOf("access_token=") === -1) return Promise.resolve(false);
    var p = new URLSearchParams(h.replace(/^#/, ""));
    session = {
      access_token: p.get("access_token"),
      refresh_token: p.get("refresh_token"),
      expires_at: Date.now() + (parseInt(p.get("expires_in"), 10) || 3600) * 1000,
      email: null
    };
    history.replaceState(null, "", location.pathname);
    return metaSet("session", session).then(function () { return true; });
  }

  /* ---------------- status ---------------- */
  function setStatus(s) {
    statusText = s;
    var el = document.getElementById("status");
    if (!el) return;
    el.dataset.s = s;
    el.textContent =
      s === "saved" ? "saved on this device"
      : s === "pending" ? (pendingCount() + " waiting to sync")
      : s === "syncing" ? "syncing…"
      : s === "synced" ? "synced"
      : s === "offline" ? "offline — saved here"
      : s === "signin" ? "sign in to sync"
      : "";
  }

  /* ---------------- render ---------------- */
  function isTouch() {
    return window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  }

  function render() {
    var root = document.getElementById("root");
    if (!root) return;
    var live = document.getElementById("field");
    var carry = live ? live.value : null;
    var hadFocus = live && document.activeElement === live;

    var o = openItems();
    var doneCount = items.length - o.length;

    root.innerHTML =
      '<div class="wrap">' +
        '<div class="top">' +
          '<button class="mark" data-go="dump">Loose <em>Threads</em></button>' +
          '<nav class="nav">' +
            nav("dump", "Dump", null) +
            nav("review", "Threads", o.length) +
            nav("sorted", "Sorted", doneCount) +
            '<button class="gear" data-go="settings" aria-current="' + (view === "settings") + '" title="Settings">•••</button>' +
          '</nav>' +
        '</div>' +
        '<div class="status" id="status"></div>' +
        '<main id="main"></main>' +
      '</div>';

    var main = document.getElementById("main");
    main.innerHTML =
      view === "dump" ? dumpView() :
      view === "review" ? reviewView() :
      view === "sorted" ? sortedView() : settingsView();

    setStatus(statusText);

    if (view === "dump") {
      var f = document.getElementById("field");
      if (f) {
        if (carry) f.value = carry;
        grow(f);
        if (hadFocus || !isTouch()) f.focus();
      }
    }
  }

  function nav(v, label, n) {
    return '<button data-go="' + v + '" aria-current="' + (view === v) + '">' + label +
      (n === null ? "" : '<span class="n">' + n + '</span>') + "</button>";
  }

  function dumpView() {
    var day = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
    var recent = openItems().slice(0, 3);
    var waiting = openItems().length;
    return '<div class="dump">' +
      '<div class="eyebrow">' + esc(day) + "</div>" +
      '<div class="line"><textarea id="field" rows="1" placeholder="what just came to mind?" ' +
        'autocapitalize="sentences" autocomplete="off" spellcheck="false"></textarea></div>' +
      '<div class="hint"><span><kbd>Enter</kbd> to catch it</span>' +
        "<span><kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span></div>" +
      (recent.length
        ? '<div class="caught"><div class="caught-h">Just caught</div>' +
          recent.map(function (i) {
            return '<div class="caught-row"><span>' + esc(i.body.split("\n")[0].slice(0, 90)) +
              '</span><span class="ago">' + ago(i.created) + "</span></div>";
          }).join("") + "</div>"
        : "") +
      (waiting
        ? '<button class="tolist" data-go="review">' + waiting + ' waiting to be sorted <span class="arrow">→</span></button>'
        : "") +
      "</div>";
  }

  function reviewView() {
    var all = openItems();
    if (!all.length) return '<div class="empty">Nothing loose.<span>Go and enjoy that.</span></div>';

    var staleCount = all.filter(isStale).length;
    var counts = { all: all.length, none: all.filter(function (i) { return !i.bucket; }).length };
    BUCKETS.forEach(function (b) {
      counts[b.k] = all.filter(function (i) { return i.bucket === b.k; }).length;
    });

    var shown = all.filter(function (i) {
      if (filter === "all") return true;
      if (filter === "none") return !i.bucket;
      if (filter === "stale") return isStale(i);
      return i.bucket === filter;
    });

    var chips = '<button class="chip" data-filter="all" aria-pressed="' + (filter === "all") + '">Everything<span class="c">' + counts.all + "</span></button>" +
      BUCKETS.map(function (b) {
        return '<button class="chip" data-filter="' + b.k + '" aria-pressed="' + (filter === b.k) + '">' +
          b.label + '<span class="c">' + counts[b.k] + "</span></button>";
      }).join("") +
      '<button class="chip" data-filter="none" aria-pressed="' + (filter === "none") + '">Unsorted<span class="c">' + counts.none + "</span></button>";

    var nudge = (staleCount && filter !== "stale")
      ? '<button class="nudge" data-filter="stale"><span class="dot"></span>' +
        staleCount + (staleCount === 1 ? " thread has" : " threads have") +
        ' been sitting here over a week.<span class="go">Show</span></button>'
      : "";

    return '<div class="filters">' + chips + "</div>" + nudge +
      '<div class="list">' + shown.map(row).join("") + "</div>" +
      (shown.length ? "" : '<div class="empty">Nothing here.<span>Try another filter.</span></div>') +
      '<div class="foot"><span>Tap a label to sort it. Touching a thread resets its clock.</span></div>';
  }

  function row(i) {
    return '<div class="item' + (isStale(i) ? " stale" : "") + '" data-id="' + i.id + '">' +
      '<div class="item-t">' + esc(i.body) + "</div>" +
      '<div class="item-b"><span class="age">' + ago(i.created) + "</span>" +
      BUCKETS.map(function (b) {
        return '<button class="tag" data-tag="' + b.k + '" aria-pressed="' + (i.bucket === b.k) + '">' + b.label + "</button>";
      }).join("") +
      '<span class="acts">' +
        '<button class="act done" data-act="done">Done</button>' +
        '<button class="act drop" data-act="dropped">Drop</button>' +
      "</span></div></div>";
  }

  function sortedView() {
    var list = sorted().filter(function (i) { return i.status !== "open"; })
      .sort(function (a, b) { return (b.updated || "").localeCompare(a.updated || ""); });
    if (!list.length) return '<div class="empty">Nothing sorted yet.<span>Things you finish or drop land here.</span></div>';
    return '<div class="list">' + list.map(function (i) {
      return '<div class="item ' + (i.status === "done" ? "done" : "dropped") + '" data-id="' + i.id + '">' +
        '<div class="item-t">' + esc(i.body) + "</div>" +
        '<div class="item-b"><span class="age">' + (i.status === "done" ? "done " : "dropped ") + ago(i.updated) + "</span>" +
        '<span class="acts"><button class="act back" data-act="open">Put it back</button></span></div></div>';
    }).join("") + "</div>";
  }

  // One answer to one question: are these threads everywhere, or still only here?
  function whereRow() {
    var n = pendingCount();
    var head = function (state, title, sub) {
      return '<div class="bigstat"><span class="sdot ' + state + '"></span><div>' +
        "<h3>" + title + "</h3><p>" + sub + "</p></div></div>";
    };

    if (!cfg || !session) {
      return head("a", "Only on this device",
        "Sign in below and these join your other devices.");
    }
    if (n) {
      return head("a", n + (n === 1 ? " thread is" : " threads are") + " only on this device",
        navigator.onLine === false
          ? "You're offline. " + (n === 1 ? "It'll" : "They'll") + " go up automatically when you're back — nothing to remember."
          : (n === 1 ? "Sending it now." : "Sending them now."));
    }
    return head("g", "On all your devices",
      (navigator.onLine === false ? "You're offline, but everything here already went up." : "Nothing waiting.") +
      (lastSync ? " Last checked " + ago(lastSync) + "." : ""));
  }

  function settingsView() {
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);

    return '<div class="set">' +

      "<section>" +
        "<h2>Where your threads are</h2>" +
        '<div class="card">' +
          whereRow() +
          '<p class="fine" id="offlinefine">Saved on this device the moment you type them, then sent on.</p>' +
          '<p class="fine warn" id="storagewarn" hidden></p>' +
        "</div>" +
        (ios
          ? '<p class="note" style="margin-top:12px">To keep an icon on your Home Screen: <b>Share → Add to Home Screen</b>.</p>'
          : '<p style="margin-top:12px" id="installrow"></p>') +
      "</section>" +

      "<section>" +
        "<h2>Your account</h2>" +
        (cfg
          ? (session
              ? '<div class="card">' +
                '<div class="note ok">Signed in' + (session.email ? " as " + esc(session.email) : "") + ".</div>" +
                '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
                  '<button class="btn" data-do="syncnow">Check for updates</button>' +
                  '<button class="btn ghost" data-do="signout">Sign out</button>' +
                  (baked() ? "" : '<button class="btn ghost" data-do="forget">Disconnect database</button>') +
              '<div class="card"><div class="f"><label>Your email</label>' +
                '<input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div>' +
                '<button class="btn" data-do="signin">Send me a sign-in link</button>' +
                '<div class="note" id="authnote">A one-time link, no password. Open it on this device and you\'re in.</div>' +
                (baked() ? "" : '<button class="btn ghost" data-do="forget">Use a different database</button>') +
                "</div>")
          : '<div class="card">' +
            '<div class="f"><label>Supabase project URL</label>' +
            '<input id="surl" type="url" inputmode="url" autocomplete="off" placeholder="https://xxxx.supabase.co"></div>' +
            '<div class="f"><label>Anon public key</label>' +
            '<input id="skey" type="text" autocomplete="off" placeholder="eyJhbGciOi…"></div>' +
            '<button class="btn" data-do="savecfg">Save</button>' +
            '<div class="note">Both live in your Supabase dashboard under Settings → API Keys.</div>' +
            "</div>") +
      "</section>" +

      "<section>" +
        "<h2>Your data</h2>" +
        '<div class="kv"><span>Threads held here:</span><b>' + items.length + "</b></div>" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
        '<button class="btn ghost" data-do="export">Download a copy</button></div>' +
        '<div class="note" style="margin-top:8px"></div>" +
      "</section>" +


    "</div>";
  }

  function grow(el) {
    el.style.height = "auto";
    el.style.height = Math.max(el.scrollHeight, 44) + "px";
  }

  var flashTimer = null;
  function flash(msg) {
    var el = document.getElementById("flash");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { el.classList.remove("on"); }, 1700);
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", function (e) {
    if (!e.target || !e.target.closest) return;

    var go = e.target.closest("[data-go]");
    if (go) {
      view = go.dataset.go;
      if (view === "review") filter = "all";
      render();
      if (view === "settings") refreshDiagnostics();
      return;
    }
    var f = e.target.closest("[data-filter]");
    if (f) { filter = f.dataset.filter; render(); return; }

    var doo = e.target.closest("[data-do]");
    if (doo) { settingsAction(doo.dataset.do, doo); return; }

    var it = e.target.closest(".item");
    if (!it) return;
    var id = it.dataset.id;

    var tag = e.target.closest("[data-tag]");
    if (tag) {
      var cur = items.filter(function (x) { return x.id === id; })[0];
      patch(id, { bucket: cur && cur.bucket === tag.dataset.tag ? null : tag.dataset.tag });
      render();
      return;
    }
    var act = e.target.closest("[data-act]");
    if (act) {
      patch(id, { status: act.dataset.act });
      flash(act.dataset.act === "done" ? "Done." : act.dataset.act === "dropped" ? "Let it go." : "Back in the pile.");
      render();
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "field") grow(e.target);
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.id === "field") {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (e.target.value.trim()) {
          capture(e.target.value);
          e.target.value = "";
          grow(e.target);
          flash("Caught it.");
          render();
          var f = document.getElementById("field");
          if (f) f.focus();
        }
      }
      return;
    }
    if (e.key === "Escape") { view = "dump"; render(); }
  });

  window.addEventListener("online", function () { setStatus(cfg ? "pending" : "saved"); scheduleSync(); });
  window.addEventListener("offline", function () { if (pendingCount()) setStatus("offline"); });
  window.addEventListener("focus", function () {
    if (view === "dump" && !isTouch()) {
      var f = document.getElementById("field");
      if (f && document.activeElement !== f) f.focus();
    }
    scheduleSync();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") scheduleSync();
  });
  // A Shortcut opening #add=… while the app is already open is a same-document
  // navigation: no reload happens, so catch it here too.
  window.addEventListener("hashchange", function () {
    var arrived = inbound();
    if (!arrived.length) return;
    arrived.forEach(capture);
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    view = "dump";
    render();
    flash(arrived.length === 1 ? "Caught it." : "Caught " + arrived.length + ".");
  });

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
  });

  /* ---------------- settings actions ---------------- */
  function settingsAction(what, el) {
    if (what === "savecfg") {
      var u = (document.getElementById("surl") || {}).value || "";
      var k = (document.getElementById("skey") || {}).value || "";
      u = u.trim().replace(/\/+$/, "");
      k = k.trim();
      if (!/^https:\/\/.+/.test(u) || k.length < 20) { flash("That doesn't look right — check both fields."); return; }
      cfg = { url: u, key: k };
      metaSet("config", cfg).then(function () { render(); });
      return;
    }
    if (what === "forget") {
      cfg = null; session = null;
      Promise.all([metaSet("config", null), metaSet("session", null), ])
        .then(function () { setStatus("saved"); render(); });
      return;
    }
    if (what === "signout") {
      session = null;
      metaSet("session", null).then(function () { setStatus("saved"); render(); });
      return;
    }
    if (what === "syncnow") { sync(); return; }
    if (what === "signin") {
      var email = ((document.getElementById("email") || {}).value || "").trim();
      var note = document.getElementById("authnote");
      if (!/.+@.+\..+/.test(email)) { if (note) { note.className = "note bad"; note.textContent = "That email doesn't look complete."; } return; }
      el.disabled = true;
      if (note) { note.className = "note"; note.textContent = "Sending…"; }
      signIn(email).then(function () {
        if (note) { note.className = "note ok"; note.textContent = "Check " + email + " and open the link on this device."; }
      }).catch(function (err) {
        el.disabled = false;
        if (note) { note.className = "note bad"; note.textContent = "Couldn't send it: " + (err.message || "unknown error").slice(0, 140); }
      });
      return;
    }
    if (what === "export") {
      var blob = new Blob([JSON.stringify({ exported: nowIso(), items: sorted() }, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "loose-threads-" + nowIso().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
  }

  function refreshDiagnostics() {
    var fine = document.getElementById("offlinefine");
    if (fine) {
      var ready = "Saved on this device the moment you type them, then sent on. Works with no internet.";
      if (!("serviceWorker" in navigator)) {
        fine.textContent = "Saved on this device the moment you type them. This browser needs a connection to open the app.";
      } else {
        navigator.serviceWorker.getRegistration().then(function (r) {
          fine.textContent = r && r.active
            ? ready
            : "Saved on this device the moment you type them. Open this page once more with a connection so it can work offline too.";
        }).catch(function () { fine.textContent = ready; });
      }
    }
    // Only worth mentioning when there's no server copy to fall back on.
    var warn = document.getElementById("storagewarn");
    if (warn && navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then(function (p) {
        var atRisk = !p && (!cfg || !session);
        warn.hidden = !atRisk;
        if (atRisk) {
          warn.textContent = "This browser may clear them if it runs short on space, and there's no copy anywhere else. Signing in fixes that.";
        }
      });
    }
    var ir = document.getElementById("installrow");
    if (ir && deferredInstall) {
      ir.innerHTML = '<button class="btn" data-do="install">Install as an app</button>';
      ir.querySelector("button").addEventListener("click", function () {
        deferredInstall.prompt();
        deferredInstall = null;
      });
    }
  }

  /* ---------------- boot ---------------- */
  // Accept a thought from the URL, encoded or not. Everything after `add=` is the
  // thought — including & and # — so a Shortcut doesn't need a URL-encode step, and
  // a stray % (as in "50% off") falls back to the raw text instead of throwing.
  function inbound() {
    var out = [];
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("add")) out.push(q.get("add"));
    } catch (e) {}
    try {
      var h = location.hash || "";
      var m = /[#&]add=/.exec(h);
      if (m) {
        // Decode each run of %XX escapes on its own (a run, so multi-byte UTF-8
        // survives) and leave anything that isn't a valid escape exactly as typed.
        out.push(h.slice(m.index + m[0].length).replace(/(?:%[0-9A-Fa-f]{2})+/g, function (seq) {
          try { return decodeURIComponent(seq); } catch (e) { return seq; }
        }));
      }
    } catch (e) {}
    return out.filter(function (t) { return t && t.trim(); });
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(function (p) { if (!p) navigator.storage.persist().catch(function () {}); });
  }

  Promise.all([allItems(), metaGet("config"), metaGet("session"), metaGet("lastSync")])
    .then(function (r) {
      lastSync = r[3] || null;
      items = r[0] || [];
      cfg = r[1] || (DEFAULT_CFG.url && DEFAULT_CFG.key
        ? { url: DEFAULT_CFG.url, key: DEFAULT_CFG.key }
        : null);
      session = r[2] || null;
      return captureAuthRedirect();
    })
    .catch(function () { items = items || []; })
    .then(function () {
      var arrived = inbound();
      if (arrived.length) {
        arrived.forEach(capture);
        try { history.replaceState(null, "", location.pathname); } catch (e) {}
      }
      setStatus(cfg ? (session ? (pendingCount() ? "pending" : "synced") : "signin") : "saved");
      render();
      if (arrived.length) flash(arrived.length === 1 ? "Caught it." : "Caught " + arrived.length + ".");
      scheduleSync();
    });

  setInterval(function () { if (view === "review" || view === "sorted") render(); }, 60000);
})();

</script>
</body>
</html>
